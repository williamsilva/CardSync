spring:
  application:
    name: cardsync
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    properties:
      hibernate.jdbc.batch_size: 1000
      hibernate.order_inserts: true
      hibernate.order_updates: true
      hibernate.jdbc.batch_versioned_data: true
      hibernate:
        default_batch_fetch_size: 100

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m

  jackson:
    time-zone: UTC

  servlet:
    multipart:
      # Tamanho máximo por arquivo e por requisição no upload manual de arquivos
      # (EEFI/CNAB/ERP). CNAB240 de bancos com muitos lançamentos pode passar de alguns MB.
      max-file-size: ${FILE_PROCESSING_UPLOAD_MAX_FILE_SIZE:50MB}
      max-request-size: ${FILE_PROCESSING_UPLOAD_MAX_REQUEST_SIZE:200MB}

  messages:
    basename: messages
    encoding: UTF-8
    thymeleaf:
      encoding: UTF-8

server:
  port: ${PORT:9091}
  forward-headers-strategy: framework
  servlet:
    encoding:
      force: true
      charset: UTF-8
      enabled: true
    session:
      cookie:
        # Nome distinto do padrão "SESSION" - senão colide com o cookie de sessão do
        # NimbusFlowServer (mesmo nome, mesmo domínio "localhost", só porta diferente - cookies
        # HTTP não diferenciam por porta) e cada app sobrescreve o cookie do outro no navegador,
        # deslogando os dois.
        name: CARDSYNC_SESSION

cardsync:
  app:
    # Timezone de negócio usada por schedulers, cálculos de início/fim de dia e logs operacionais.
    business-zone: America/Sao_Paulo

  maintenance:
    # Cron do ANALYZE TABLE (domingo 02h por padrão).
    # Desativar com ANALYZE_TABLE_ENABLED=false se o banco já faz manutenção automática.
    analyze-table-cron: ${ANALYZE_TABLE_CRON:0 0 2 * * SUN}

# File processing migrated from Nimbus API
file-processing:
  # Diretório raiz dos arquivos processados pelo CardSync. Em produção (Railway), deve
  # apontar para o mount path de um Volume persistente (ex.: /data/cardsync) via
  # FILE_PROCESSING_BASE_PATH — sem isso, o upload manual grava num disco efêmero que
  # some a cada deploy/restart do container.
  base-path: ${FILE_PROCESSING_BASE_PATH:C:/cardsync/files}

  # Diretórios base derivados do base-path.
  base-bank: ${file-processing.base-path}/bank
  base-acquirer: ${file-processing.base-path}/acquirer

  erp:
    # PV padrão usado quando o arquivo ERP não informa estabelecimento/PV.
    default-pv-number: ${ERP_DEFAULT_PV_NUMBER:}

    # Define se o ERP informa a empresa no arquivo. Quando false, o sistema usa fallback por configuração/contexto.
    informs-company: ${ERP_INFORMS_COMPANY:false}

    # Dados padrão de empresa usados quando o ERP não informa empresa e o fallback estiver habilitado.
    default-company-cnpj: ${ERP_DEFAULT_COMPANY_CNPJ:}
    default-company-name: ${ERP_DEFAULT_COMPANY_NAME:}

    # Grupo de PV padrão usado em cargas ERP sem contexto completo de estabelecimento.
    default-pv-group-number: ${ERP_DEFAULT_PV_GROUP_NUMBER:}

    # Define se o ERP informa estabelecimento no arquivo. Quando false, usa default-pv-number/default-establishment-name.
    informs-establishment: ${ERP_INFORMS_ESTABLISHMENT:false}

    # Nome comercial padrão usado em arquivos ERP sem identificação clara.
    default-commercial-name: ${ERP_DEFAULT_COMMERCIAL_NAME:ERP}

    # Nome padrão do estabelecimento quando não vier no arquivo ERP.
    default-establishment-name: ${ERP_DEFAULT_ESTABLISHMENT_NAME:}

  systems:

    erp:
      input: ${file-processing.base-path}/ERP/input

    acquirer:
      rede:
        input: ${file-processing.base-acquirer}/REDE/input

      cielo:
        input: ${file-processing.base-acquirer}/CIELO/input

    bank:
      itau:
        input: ${file-processing.base-bank}/ITAU/input

      santander:
        input: ${file-processing.base-bank}/SANTANDER/input

      bradesco:
        input: ${file-processing.base-bank}/BRADESCO/input

      sicredi:
        input: ${file-processing.base-bank}/SICREDI/input

  reconciliation:
    # Limite máximo de candidatos para tentativa de combinação/subset recursivo.
    # Evita explosão combinatória em conciliações bancárias com muitos lançamentos candidatos.
    recursive-limit: ${RECONCILIATION_RECURSIVE_LIMIT:30}

    # Limite de segurança em centavos para algoritmos de combinação/DP.
    # Evita consumo excessivo de memória/CPU em grupos muito grandes.
    safe-cap-cents: ${RECONCILIATION_SAFE_CAP_CENTS:50000000}

    # Teto de centavos para a busca de subconjunto por programação dinâmica (0/1 knapsack) —
    # movido para cs_reconciliation_settings.subset_dp_max_cents (tela de Configurações de
    # Conciliação), ajustável sem redeploy. Ver ReconciliationSettingsService.getSubsetDpMaxCents.

    # A conciliação bancária é dirigida somente por ordens de crédito elegíveis.
    bank-mode: ${BANK_RECONCILIATION_MODE:CREDIT_ORDER_ONLY}

    # Quantidade de ordens carregadas e processadas por lote.
    bank-batch-size: ${BANK_RECONCILIATION_BATCH_SIZE:500}
