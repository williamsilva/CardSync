spring:
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      # Pool de conexões — ajustar maximum-pool-size ao limite do banco no Railway (conferir
      # o limite de conexões do plano Postgres contratado).
      # Fórmula geral: (núcleos_cpu_banco * 2) + spindle_disks
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:15}
      minimum-idle: ${HIKARI_MIN_IDLE:3}
      # Tempo máximo aguardando uma conexão do pool antes de lançar exception (ms)
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}
      # Conexão ociosa é fechada após este tempo (ms) — libera recursos no banco
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:600000}
      # Vida máxima de uma conexão — evita usar conexões que o Postgres já fechou (ms)
      max-lifetime: ${HIKARI_MAX_LIFETIME:1800000}
      # Loga stack trace se uma conexão ficar aberta por mais de 60s — ajuda a detectar leaks
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION:60000}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  properties:
    org.hibernate.envers.audit_table_suffix: _aud
    org.hibernate.envers.revision_table_name: cs_revinfo

  security:
    oauth2:
      client:
        registration:
          cardsync-bff:
            provider: cardsync-as
            client-id: ${CARDSYNC_BFF_CLIENT_ID:cardsync-bff}
            client-secret: ${CARDSYNC_BFF_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
        provider:
          cardsync-as:
            authorization-uri: ${CARDSYNC_ISSUER}/oauth2/authorize
            token-uri: ${CARDSYNC_ISSUER}/oauth2/token
            jwk-set-uri: ${CARDSYNC_ISSUER}/oauth2/jwks
            user-info-uri: ${CARDSYNC_ISSUER}/userinfo
            user-name-attribute: sub

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS}
          ssl:
            enable: ${MAIL_SMTP_SSL}

server:
  ssl:
    enabled: false
  compression:
    enabled: true

  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: LAX

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      access: unrestricted
      show-details: when-authorized
      probes:
        enabled: true
  health:
    mail:
      enabled: false
    defaults:
      enabled: true

cardsync:
  email:
    impl: ${CARDSYNC_EMAIL_IMPL}
    from-name: ${CARDSYNC_EMAIL_FROM_NAME}
    from-email: ${CARDSYNC_EMAIL_FROM_EMAIL}
    brevo:
      base-url: ${BREVO_BASE_URL}
      api-key: ${BREVO_API_KEY}

  security:
    # Issuer do NimbusAuth (não é mais o próprio CardSync).
    issuer: ${CARDSYNC_ISSUER}

    session-timeout: ${CARDSYNC_SESSION_TIMEOUT:PT30M}

    cookies:
      domain: ${CARDSYNC_COOKIE_DOMAIN}
      secure: ${CARDSYNC_COOKIE_SECURE:true}
      same-site: ${CARDSYNC_COOKIE_SAMESITE:Lax}

    resource-server:
      enabled: ${CARDSYNC_RESOURCE_SERVER_ENABLED:true}
      audience: ${CARDSYNC_RESOURCE_SERVER_AUDIENCE:cardsync-api}

    web:
      spa-base-url: ${CARDSYNC_SPA_BASE_URL:https://cardsync.com.br}
      allowed-origins:
        - ${CARDSYNC_ALLOWED_ORIGIN:https://cardsync.com.br}

# API interna (machine-to-machine) do NimbusAuth
nimbus-auth:
  base-url: ${NIMBUS_AUTH_BASE_URL}
  internal-api-secret: ${NIMBUS_INTERNAL_API_SECRET}
