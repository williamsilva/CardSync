spring:
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never

  datasource:
    password: ${DB_PASSWORD:postgres}
    username: ${DB_USERNAME:postgres}
    driver-class-name: org.postgresql.Driver
    # Postgres não cria o banco pela URL (sem equivalente a createDatabaseIfNotExist) - o
    # banco "cardsync" precisa existir antes do primeiro boot.
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_DATABASE:cardsync}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
    open-in-view: false

  properties:
    org.hibernate.envers.audit_table_suffix: _aud
    org.hibernate.envers.revision_table_name: cs_revinfo

  flyway:
    enabled: true
    locations: classpath:db/migration
    repair-on-migrate: true

  security:
    oauth2:
      client:
        registration:
          cardsync-bff:
            provider: cardsync-as
            client-id: ${CARDSYNC_BFF_CLIENT_ID:cardsync-bff}
            client-secret: ${CARDSYNC_BFF_CLIENT_SECRET:changeit-dev}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
        provider:
          cardsync-as:
            authorization-uri: ${cardsync.security.issuer}/oauth2/authorize
            token-uri: ${cardsync.security.issuer}/oauth2/token
            jwk-set-uri: ${cardsync.security.issuer}/oauth2/jwks
            user-info-uri: ${cardsync.security.issuer}/userinfo
            user-name-attribute: sub

server:
  port: 9091
  servlet:
    session:
      cookie:
        http-only: true
        secure: false # dev; em prod true
        same-site: LAX

# Swagger (será restringido no prod)
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

cardsync:
  email:
    impl: fake
    from-name: CardSync
    from-email: contato@cardsync.com.br
    brevo:
      base-url: ${BREVO_BASE_URL:https://api.brevo.com/v3}
      api-key: ${BREVO_API_KEY:}
      port: ${BREVO_PORT:587}
      username: ${BREVO_USERNAME:}
    smtp:
      host: ${MAIL_HOST:}
      port: ${MAIL_PORT:587}
      username: ${MAIL_USERNAME:}
      password: ${MAIL_PASSWORD:}
      auth: ${MAIL_SMTP_AUTH:true}
      starttls: ${MAIL_SMTP_STARTTLS:false}
      ssl: ${MAIL_SMTP_SSL:false}

  security:
    # Issuer do NimbusAuth (não é mais o próprio CardSync).
    issuer: ${CARDSYNC_ISSUER:http://localhost:9090}
    # Issuer como o NAVEGADOR resolve (RP-Initiated Logout) - só diverge de CARDSYNC_ISSUER
    # rodando em Docker (ver CardsyncSecurityProperties#getBrowserIssuer). Mesmo default de
    # CARDSYNC_ISSUER fora do Docker.
    browser-issuer: ${CARDSYNC_BROWSER_ISSUER:http://localhost:9090}

    session-timeout: ${CARDSYNC_SESSION_TIMEOUT:PT30M}

    cookies:
      domain: ${CARDSYNC_COOKIE_DOMAIN:}
      secure: ${CARDSYNC_COOKIE_SECURE:false}
      same-site: ${CARDSYNC_COOKIE_SAMESITE:Lax}

    resource-server:
      enabled: true
      audience: cardsync-api

    web:
      spa-base-url: "http://localhost:4200"
      allowed-origins:
        - "http://localhost:4200"

# API interna (machine-to-machine) do NimbusAuth
nimbus-auth:
  base-url: ${NIMBUS_AUTH_BASE_URL:http://localhost:9090}
  internal-api-secret: ${NIMBUS_INTERNAL_API_SECRET:dev-internal-secret-change-me}
